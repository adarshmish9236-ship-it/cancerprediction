# ============================================================
# CANCERWISE AI — Central Configuration
# ============================================================

project:
  name: "CANCERWISE AI"
  version: "0.1.0"
  phase: 0
  description: "Advanced Cancer Prediction and Intelligent Data Mining Platform"
  authors: ["CANCERWISE AI Team"]
  license: "MIT"

# ---- Paths -----------------------------------------------
paths:
  root: "E:/PROJECTS/DATA MINING/CANCERWISE_AI"
  data:
    raw:       "${paths.root}/data/raw"
    interim:   "${paths.root}/data/interim"
    processed: "${paths.root}/data/processed"
    external:  "${paths.root}/data/external"
    metadata:  "${paths.root}/data/metadata"
  models:
    trained:     "${paths.root}/models/trained"
    checkpoints: "${paths.root}/models/checkpoints"
    registry:    "${paths.root}/models/registry"
  logs:        "${paths.root}/logs"
  reports:     "${paths.root}/reports"
  experiments: "${paths.root}/experiments"
  notebooks:   "${paths.root}/notebooks"

# ---- Logging ---------------------------------------------
logging:
  level: "INFO"            # DEBUG | INFO | WARNING | ERROR | CRITICAL
  format: "%(asctime)s | %(levelname)-8s | %(name)s | %(message)s"
  date_format: "%Y-%m-%d %H:%M:%S"
  file_max_bytes: 10485760  # 10 MB
  file_backup_count: 5
  console: true
  file: true

# ---- MLflow ----------------------------------------------
mlflow:
  tracking_uri: "file:///E:/PROJECTS/DATA MINING/CANCERWISE_AI/experiments/mlruns"
  experiment_name: "cancerwise_ai"
  artifact_location: "${paths.root}/experiments/artifacts"
  registry_uri: "sqlite:///E:/PROJECTS/DATA MINING/CANCERWISE_AI/experiments/model_registry.db"

# ---- API -------------------------------------------------
api:
  host: "0.0.0.0"
  port: 8000
  reload: true
  workers: 1
  title: "CANCERWISE AI API"
  description: "REST API for cancer prediction and data mining services"
  version: "v1"
  prefix: "/api/v1"
  cors_origins: ["http://localhost:8501"]

# ---- Frontend (Streamlit) --------------------------------
frontend:
  host: "localhost"
  port: 8501
  page_title: "CANCERWISE AI"
  page_icon: "🧬"
  layout: "wide"
  theme: "dark"

# ---- Data Mining -----------------------------------------
data_mining:
  random_seed: 42
  test_size: 0.2
  val_size: 0.1
  cv_folds: 5
  stratify: true
  n_jobs: -1
  verbose: 1

# ---- Model Training --------------------------------------
training:
  batch_size: 32
  max_epochs: 100
  early_stopping_patience: 10
  learning_rate: 0.001
  weight_decay: 1e-4
  checkpoint_every: 5
  device: "cpu"           # "cpu" | "cuda" | "mps"

# ---- Preprocessing ---------------------------------------
preprocessing:
  missing_strategy: "median"   # mean | median | most_frequent | knn | iterative
  scaling_strategy: "standard" # standard | minmax | robust | none
  encoding_strategy: "onehot"  # onehot | ordinal | target
  outlier_method: "iqr"        # iqr | zscore | isolation_forest
  outlier_threshold: 3.0

# ---- Feature Engineering ---------------------------------
feature_engineering:
  selection_method: "mutual_info"  # mutual_info | chi2 | f_classif | rfe | lasso
  n_features_to_select: "auto"
  polynomial_degree: 2
  interaction_features: true

# ---- Evaluation ------------------------------------------
evaluation:
  primary_metric: "roc_auc"
  metrics:
    - accuracy
    - precision
    - recall
    - f1
    - roc_auc
    - average_precision
    - matthews_corrcoef
  report_format: "html"   # html | pdf | json

# ---- Explainability --------------------------------------
explainability:
  shap_enabled: true
  lime_enabled: true
  shap_max_samples: 100
  lime_num_features: 10
