# ============================================================
# CANCERWISE AI — Logging Configuration (logging.config.dictConfig)
# ============================================================

version: 1
disable_existing_loggers: false

formatters:
  standard:
    format: "%(asctime)s | %(levelname)-8s | %(name)-35s | %(message)s"
    datefmt: "%Y-%m-%d %H:%M:%S"
  detailed:
    format: "%(asctime)s | %(levelname)-8s | %(name)-35s | %(filename)s:%(lineno)d | %(funcName)s | %(message)s"
    datefmt: "%Y-%m-%d %H:%M:%S"
  json:
    "()": "pythonjsonlogger.jsonlogger.JsonFormatter"
    format: "%(asctime)s %(name)s %(levelname)s %(message)s"

handlers:
  console:
    class: logging.StreamHandler
    level: INFO
    formatter: standard
    stream: ext://sys.stdout

  file_app:
    class: logging.handlers.RotatingFileHandler
    level: DEBUG
    formatter: detailed
    filename: "logs/cancerwise_app.log"
    maxBytes: 10485760
    backupCount: 5
    encoding: utf8

  file_errors:
    class: logging.handlers.RotatingFileHandler
    level: ERROR
    formatter: detailed
    filename: "logs/cancerwise_errors.log"
    maxBytes: 10485760
    backupCount: 3
    encoding: utf8

  file_training:
    class: logging.handlers.RotatingFileHandler
    level: DEBUG
    formatter: detailed
    filename: "logs/training.log"
    maxBytes: 10485760
    backupCount: 5
    encoding: utf8

loggers:
  cancerwise:
    level: DEBUG
    handlers: [console, file_app, file_errors]
    propagate: false

  cancerwise.training:
    level: DEBUG
    handlers: [console, file_training]
    propagate: false

  cancerwise.api:
    level: INFO
    handlers: [console, file_app]
    propagate: false

  uvicorn:
    level: INFO
    handlers: [console]
    propagate: false

root:
  level: WARNING
  handlers: [console]
