[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cancerwise-ai"
version = "1.0.0"
description = "Clinically Governed Cancer Risk Prediction & Explainable Data Mining Platform"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [
    { name = "CANCERWISE AI Team" }
]
keywords = [
    "cancer-prediction",
    "oncology-research",
    "explainable-ai",
    "data-mining",
    "machine-learning",
    "fastapi",
    "streamlit",
    "clinical-decision-support"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Healthcare Industry",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]

dependencies = [
    "numpy>=1.26.0",
    "scipy>=1.12.0",
    "pandas>=2.1.0",
    "polars>=0.20.0",
    "scikit-learn>=1.4.0",
    "imbalanced-learn>=0.12.0",
    "xgboost>=2.0.0",
    "lightgbm>=4.3.0",
    "catboost>=1.2.0",
    "torch>=2.2.0",
    "shap>=0.44.0",
    "lime>=0.2.0.1",
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "python-dotenv>=1.0.0",
    "python-multipart>=0.0.9",
    "streamlit>=1.32.0",
    "plotly>=5.20.0",
    "matplotlib>=3.8.0",
    "seaborn>=0.13.0",
    "pyarrow>=15.0.0",
    "openpyxl>=3.1.0",
    "psutil>=5.9.0",
    "PyYAML>=6.0.0",
    "joblib>=1.3.0",
    "mlflow>=2.12.0",
]

[project.scripts]
cancerwise-api = "backend.main:main"
cancerwise-preflight = "scripts.preflight_check:main"

[project.urls]
Homepage = "https://github.com/cancerwise-ai/cancerwise-ai"
Documentation = "https://github.com/cancerwise-ai/cancerwise-ai/tree/main/docs"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "slow: Slow-running tests",
    "api: API endpoint tests",
    "model: Model training tests",
]

[tool.ruff]
line-length = 110
target-version = "py312"
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
